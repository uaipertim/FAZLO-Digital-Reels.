<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAZLO Digital — Player</title>
<link rel="stylesheet" href="/brand/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #0B0B0B; color: #EDEDED; font: 500 13px ui-monospace, 'DejaVu Sans Mono', monospace; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; box-sizing: border-box; min-height: 100vh; }
  .stage { position: relative; height: calc(100vh - 120px); aspect-ratio: 9 / 16; max-width: 100%; }
  canvas { width: 100%; height: 100%; border-radius: 12px; background: #000; display: block; }
  #zones { position: absolute; inset: 0; pointer-events: none; display: none; }
  #zones.on { display: block; }
  #zones div { position: absolute; background: rgba(255, 40, 80, .22); outline: 2px solid rgba(255, 40, 80, .9); outline-offset: -2px; }
  .ui { display: flex; gap: 10px; align-items: center; width: min(620px, 100%); }
  button { font: inherit; font-weight: 700; background: #EDEDED; color: #0B0B0B; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  button.ghost { background: #2A2A2A; color: #EDEDED; }
  input[type=range] { flex: 1; accent-color: #EDEDED; }
  .time { font-variant-numeric: tabular-nums; width: 120px; text-align: right; }
  .help { opacity: .55; }
  .err { color: #FF6B6B; white-space: pre-wrap; }
  body.render { padding: 0; display: block; }
  body.render .stage { height: auto; width: 1080px; aspect-ratio: auto; }
  body.render canvas { width: 1080px; height: 1920px; border-radius: 0; }
  body.render .ui, body.render .help { display: none; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="zones"></div>
</div>
<div class="ui">
  <button id="play">▶ PLAY</button>
  <input id="seek" type="range" min="0" max="1" step="0.0001" value="0">
  <span class="time" id="time">0.000 s · 0</span>
  <button id="zbtn" class="ghost" title="Zonas seguras (Z)">ZONAS</button>
</div>
<div class="help" id="help">espaço: play/pausa · ←/→: 1 quadro · shift+←/→: 1 s · Z: zonas seguras · B: liga/desliga motion blur · C: capa</div>
<audio id="audio" preload="auto"></audio>
<script src="/brand/tokens.js"></script>
<script src="/core/engine.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const id = params.get('reel') || 'reel-00';
  const base = `/reels/${id}`;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const fail = (e) => { document.getElementById('help').innerHTML = `<span class="err">${e}</span>`; throw e; };
  const loadScript = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('não carregou ' + src)); document.body.appendChild(s); });
  const loadImg = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('não carregou ' + src)); i.src = src; });
  document.title = `FAZLO Digital — ${id}`;

  let reel, cfg, zones;
  window.ready = (async () => {
    cfg = await fetch(`${base}/reel.json`).then((r) => { if (!r.ok) throw new Error(`${base}/reel.json não encontrado`); return r.json(); });
    zones = await fetch('/core/safe-zones.json').then((r) => r.json());
    // scripts auxiliares do Reel (opcional, reel.json "scripts": ["src/x.js"]), carregados antes da animação
    for (const s of cfg.scripts || []) await loadScript(`${base}/${s}`);
    await loadScript(`${base}/src/anim.js`);
    reel = FZD.get(cfg.id) || FZD.current();
    // fontes: as da marca e as listadas no reel.json precisam estar prontas antes do layout
    await Promise.all((cfg.fonts || []).map((f) => document.fonts.load(f)));
    await document.fonts.ready;
    // assets: { nome: caminho a partir da raiz do repositório }
    const assets = {};
    for (const [k, src] of Object.entries(cfg.assets || {})) { assets[k] = await loadImg('/' + src); await assets[k].decode(); }
    reel.init(assets);
  })().catch(fail);

  if (params.has('render')) {
    document.body.classList.add('render');
    // usados por tools/render.cjs
    window.frameAt = (t, noBlur = false) => { reel.renderAt(ctx, t, { noBlur }); return canvas.toDataURL('image/png'); };
    window.coverFrame = () => { reel.renderCover(ctx); return canvas.toDataURL('image/png'); };
    window.cues = () => reel.cues();
    window.duration = () => reel.DURATION;
    return;
  }

  await window.ready;
  const audio = document.getElementById('audio');
  audio.src = `${base}/audio/trilha.wav`;
  const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), btn = document.getElementById('play');
  const zEl = document.getElementById('zones');
  for (const z of zones.zones) {
    const [x0, y0, x1, y1] = z.rect, d = document.createElement('div');
    Object.assign(d.style, { left: `${x0 / 10.8}%`, top: `${y0 / 19.2}%`, width: `${(x1 - x0) / 10.8}%`, height: `${(y1 - y0) / 19.2}%` });
    d.title = z.name; zEl.appendChild(d);
  }
  const D = reel.DURATION, FPS = reel.FPS;
  seek.max = D;
  let playing = false, t0 = 0, base0 = 0, cur = 0, noBlur = false, cover = params.has('cover');
  const draw = (t) => {
    cur = t; cover = false;
    reel.renderAt(ctx, t, { noBlur });
    seek.value = t; timeEl.textContent = `${t.toFixed(3)} s · ${Math.round(t * FPS)}`;
  };
  const loop = (now) => {
    if (!playing) return;
    let t = audio.readyState >= 2 && !audio.paused ? audio.currentTime : base0 + (now - t0) / 1000;
    if (t >= D) { t = 0; base0 = 0; t0 = now; audio.currentTime = 0; }
    draw(t); requestAnimationFrame(loop);
  };
  const toggle = () => {
    playing = !playing; btn.textContent = playing ? '❚❚ PAUSA' : '▶ PLAY';
    if (playing) { base0 = cur; t0 = performance.now(); audio.currentTime = base0; audio.play().catch(() => {}); requestAnimationFrame(loop); }
    else audio.pause();
  };
  const jump = (t) => { if (playing) toggle(); draw(Math.min(D - 1e-4, Math.max(0, t))); };
  btn.onclick = toggle;
  seek.oninput = () => jump(+seek.value);
  document.getElementById('zbtn').onclick = () => zEl.classList.toggle('on');
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') jump(cur + (e.shiftKey ? 1 : 1 / FPS));
    else if (e.code === 'ArrowLeft') jump(cur - (e.shiftKey ? 1 : 1 / FPS));
    else if (e.code === 'KeyZ') zEl.classList.toggle('on');
    else if (e.code === 'KeyB') { noBlur = !noBlur; draw(cur); }
    else if (e.code === 'KeyC') { if (playing) toggle(); reel.renderCover(ctx); cover = true; }
  });
  if (params.has('zones')) zEl.classList.add('on');
  if (cover) reel.renderCover(ctx); else draw(+(params.get('t') || 0));
})();
</script>
</body>
</html>
