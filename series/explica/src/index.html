<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAZLO Digital — Série Explica</title>
<link rel="stylesheet" href="/brand/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #050606; color: #FFFFFF; font-family: 'FZD Text', sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; box-sizing: border-box; min-height: 100vh; }
  canvas { height: calc(100vh - 110px); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 14px; background: #050606; }
  .ui { display: flex; gap: 12px; align-items: center; width: min(560px, 100%); }
  button { font: 700 14px 'FZD Text', sans-serif; letter-spacing: 1px; background: #C6FA41; color: #0A0C0B; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: #C6FA41; }
  .time { font-variant-numeric: tabular-nums; width: 64px; text-align: right; }
  body.render { padding: 0; display: block; }
  body.render canvas { height: auto; width: 1080px; border-radius: 0; }
  body.render .ui { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="ui">
  <button id="play">PLAY</button>
  <input id="seek" type="range" min="0" max="90" step="0.01" value="0">
  <span class="time" id="time">0.00s</span>
</div>
<audio id="audio" preload="auto"></audio>
<script src="motor.js"></script>
<script>
  // prévia: /series/explica/src/index.html?ep=explica-01&t=12.5  ·  render: &render (usado por scripts/render.cjs)
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const params = new URLSearchParams(location.search);
  const EPID = params.get('ep') || 'explica-01';
  window.ready = (async () => {
    const pesos = [[800, 'FZD Display'], [900, 'FZD Display'], [400, 'FZD Text'], [500, 'FZD Text'], [600, 'FZD Text'], [700, 'FZD Text']];
    const [svg, linha] = await Promise.all([
      fetch('/brand/logo/kit/FAZLO-DIGITAL-branca-transparente.svg').then((r) => r.text()),
      fetch(`/series/explica/audio/${EPID}/linha.json`).then((r) => r.json()),
      ...pesos.map(([w, f]) => document.fonts.load(`${w} 100px '${f}'`)),
    ]);
    await document.fonts.ready;
    const extras = {};
    if (linha.telas) {                                  // telas reais do site (collab): PNGs + caixas + a mensagem
      extras.telas = await fetch(`/${linha.telas}/telas.json`).then((r) => r.json());
      extras.imgs = {};
      await Promise.all(Object.keys(extras.telas.telas).map((nome) => new Promise((ok, erro) => {
        const im = new Image(); im.onload = () => { extras.imgs[nome] = im; ok(); }; im.onerror = erro; im.src = `/${linha.telas}/${nome}.png`;
      })));
    }
    EXPLICA.init(svg, linha, extras);
    document.title = `FAZLO Digital — Explica ${EPID}`;
  })();

  if (params.has('render')) {
    document.body.classList.add('render');
    window.frameAt = (t, o) => { EXPLICA.renderAt(ctx, t, o); return canvas.toDataURL('image/png'); };
    window.cues = () => EXPLICA.cues();
    window.caixas = (t) => EXPLICA.caixas(ctx, t);
  } else {
    const audio = document.getElementById('audio');
    audio.src = `/series/explica/audio/${EPID}/mix.wav`;
    const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), btn = document.getElementById('play');
    let playing = false, t0 = 0, base = 0;
    const draw = (t) => { EXPLICA.renderAt(ctx, t); seek.value = t; timeEl.textContent = t.toFixed(2) + 's'; };
    const loop = (now) => {
      if (!playing) return;
      let t = audio.readyState >= 2 && !audio.paused ? audio.currentTime : base + (now - t0) / 1000;
      if (t >= EXPLICA.DURATION) { t = 0; base = 0; t0 = now; audio.currentTime = 0; }
      draw(t); requestAnimationFrame(loop);
    };
    btn.onclick = () => {
      playing = !playing; btn.textContent = playing ? 'PAUSA' : 'PLAY';
      if (playing) { base = +seek.value; t0 = performance.now(); audio.currentTime = base; audio.play().catch(() => {}); requestAnimationFrame(loop); }
      else audio.pause();
    };
    seek.oninput = () => { base = +seek.value; t0 = performance.now(); audio.currentTime = base; draw(base); };
    window.ready.then(() => { seek.max = (EXPLICA.DURATION - 0.01).toFixed(2); draw(+(params.get('t') || 0)); });
  }
</script>
</body>
</html>
